
name: Publish ColorLab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
            
      - name: Install marimo and dependencies
        run: python -m pip install --upgrade marimo uv numpy pandas matplotlib scipy plotly pillow
      
      - name: Export interactive WASM application
        run: python -m marimo export html-wasm photo_app.py -o site --mode run --no-show-code

      - name: Keep GitHub Pages assets unchanged
        run: touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
